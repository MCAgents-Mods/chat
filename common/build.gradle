// Implementations of the api/ contracts: storage, the OpenRouter client, retrieval.
//
// This module must compile and be testable without Minecraft on the classpath. If a class
// here needs a Minecraft type, the value belongs in an api/ contract supplied by the
// platform module instead — see .agents/rules/repository.md.

plugins {
    id 'java-library'

    // TestSigner lives in src/testFixtures rather than src/test: a test source set is
    // private to its own project, and a fixture another module's tests need must not be
    // copied there. This project's own tests still see it automatically.
    id 'java-test-fixtures'
}

base {
    archivesName = 'MCAgentsChatCommon'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':chat-api')

    // Core's model client, HTTP transport, tool registry and agent, which chat's tools and
    // answers go through. Provided in game by the mcagents_core mod, so compiled against and
    // never bundled, like core's API above.
    compileOnlyApi libs.core.common

    // The only third-party runtime dependency. platforms/fabric bundles it into the mod
    // jar with Loom's `include`.
    implementation libs.sqlite.jdbc

    // Minecraft ships Gson, so it is present at runtime in the game and must NOT be
    // bundled. compileOnly here says exactly that: compile against it, ship nothing.
    // Tests run outside the game, so they need it on their own runtime classpath.
    compileOnly libs.gson
    testImplementation libs.gson

    // Tests run outside the game, where no core mod provides core. Its fixtures carry the
    // network and key doubles the client is driven with.
    testImplementation libs.core.api
    testImplementation libs.core.common
    // Core 0.5.0 publishes its test fixtures under the capability its project name gives
    // them, io.github.mcagentsmods:common-test-fixtures, rather than under its artifact id,
    // so testFixtures(libs.core.common) finds them only in the composite build. Asking for
    // that capability by name works both against a core checkout and the published core.
    testImplementation(libs.core.common) {
        capabilities {
            requireCapability 'io.github.mcagentsmods:common-test-fixtures'
        }
    }

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

// This module carries the logic worth testing, and it is testable precisely because
// Minecraft is not on its classpath.
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'MCAgentsChatCommon'
                url = 'https://github.com/MCAgents-Mods/chat'
            }
        }
    }
}
