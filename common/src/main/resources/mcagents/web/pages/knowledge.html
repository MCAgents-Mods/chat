<!DOCTYPE html>
<!--
  The knowledge list. Served at /knowledge/ by LocalWebConsole.

  Everything below is static: the page fetches what it shows, so this file never contains
  player data and there is nothing here to escape. Assets are same-origin and nothing is
  fetched from off the machine — see .agents/design/web-design-system.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Knowledge · MCAgents Console</title>
  <script>
    window.SITE_ROOT = '../';
    window.PAGE_SECTION = 'knowledge';
  </script>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/shared/layout.css">
  <link rel="stylesheet" href="../assets/css/shared/components.css">
  <link rel="stylesheet" href="../assets/css/knowledge/knowledge.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <div class="container">
    <section class="hero">
      <p class="eyebrow">Local library</p>
      <h1>Knowledge Packs</h1>
      <p class="lead">Everything downloaded to this machine. Twenty load at a time — keep
        scrolling for more.</p>
    </section>

    <div class="toolbar">
      <div class="search">
        <label class="visually-hidden" for="knowledge-search">Search packs</label>
        <input class="field" id="knowledge-search" type="search" autocomplete="off"
               placeholder="Search titles and text…">
      </div>
      <button class="btn btn--small" type="button" id="refresh-knowledge">Refresh</button>
      <span class="count" id="knowledge-count"></span>
      <span class="sync-note" id="sync-note"></span>
    </div>

    <div class="chip-row" id="knowledge-filters" role="group" aria-label="Filter by category">
      <button class="chip" type="button" data-availability="free">Free</button>
      <button class="chip" type="button" data-availability="premium">Premium</button>
    </div>

    <div class="pack-scroller pack-scroller--library" id="pack-scroller" tabindex="0"
         role="region" aria-label="Knowledge Packs">
      <div class="card-grid" id="knowledge-list"></div>
      <div id="scroll-sentinel" aria-hidden="true"></div>
    </div>

    <!-- Kept out of the list above rather than merged into it. That list is a window over a
         local table and pages with an offset; this comes from the network and disappears
         when the service is asleep. Interleaving them would page a union of two sources with
         different costs and different failure modes. -->
    <section class="available" id="available-section">
      <div class="toolbar">
        <h2 class="available__title">Available to download</h2>
        <span class="count" id="available-count"></span>
      </div>
      <!-- Its own scroller, like the library above. A catalog that grew would otherwise
           push the page down indefinitely, and the heading a reader is using to tell the
           two lists apart would scroll away with it. -->
      <div class="pack-scroller pack-scroller--available" id="available-scroller" tabindex="0"
           role="region" aria-label="Packs available to download">
        <div class="card-grid" id="available-list"></div>
      </div>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="../assets/js/site.js"></script>
<script src="../assets/js/service.js"></script>
<script src="../assets/js/knowledge.js"></script>
</body>
</html>
