pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads a matching JDK when the toolchain the build asks for is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'chat'

// MCAgents core — the model client, the holograms, the tool registry and the tool-calling
// agent chat runs on. With a checkout of
// MCAgents-Mods/core beside this one (or wherever -Pcore-build points), Gradle builds chat
// against that source, so a change to core is tested here before it is published. Without
// one, the published core-api, core-common and
// core-client are resolved from core's GitHub Packages repository
// instead, which build.gradle declares.
def coreBuild = file(providers.gradleProperty('core-build').getOrElse('../core'))
if (new File(coreBuild, 'settings.gradle').isFile()) {
    includeBuild(coreBuild) {
        dependencySubstitution {
            substitute module('io.github.mcagentsmods:core-api') using project(':api')
            substitute module('io.github.mcagentsmods:core-common') using project(':common')
            substitute module('io.github.mcagentsmods:core-client') using project(':platforms:client')
        }
    }
}

include 'chat-api'
project(':chat-api').projectDir = file('api')

include 'chat-common'
project(':chat-common').projectDir = file('common')

// platforms/shared and each loader compile against Minecraft: one module each, for the one
// Minecraft version chat supports, which the catalog names. The project is named
// chat-{module}, without the version, which is also its published artifact id; the jar's
// name carries the version.
['shared', 'fabric', 'neoforge', 'forge'].each { module ->
    include "chat-${module}"
    project(":chat-${module}").projectDir = file("platforms/${module}")
}
