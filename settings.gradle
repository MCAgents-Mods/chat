pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads a matching JDK when the toolchain the build asks for is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'chat'

// Every Minecraft version this mod builds for. platforms/shared and each loader compile
// against Minecraft, so each is a folder of shared sources, platforms/{module}/src, with one
// subproject per version in platforms/{module}/{version}, holding only what differs for that
// version. The subproject is named mcagents-chat-{module}-{version}, which is also its
// published artifact id. The catalog carries one block of coordinates per version.
def minecraftVersions = ['26.2', '26.3']

// MCAgents core — the model client and the holograms chat runs on. With a checkout of
// MCAgents-Mods/core beside this one (or wherever -Pcore-build points), Gradle builds chat
// against that source, so a change to core is tested here before it is published. Without
// one, the published mcagents-core-api, mcagents-core-common and
// mcagents-core-client-{minecraft} are resolved from core's GitHub Packages repository
// instead, which build.gradle declares.
def coreBuild = file(providers.gradleProperty('core-build').getOrElse('../core'))
if (new File(coreBuild, 'settings.gradle').isFile()) {
    includeBuild(coreBuild) {
        dependencySubstitution {
            substitute module('io.github.mcagentsmods:mcagents-core-api') using project(':api')
            substitute module('io.github.mcagentsmods:mcagents-core-common') using project(':common')
            // Every version core builds, not only chat's: agents, built with chat below, compiles
            // against core's client for each version it builds, and needs the same substitution.
            new File(coreBuild, 'platforms/client').listFiles()
                    .findAll { new File(it, 'build.gradle').isFile() }
                    .each { version ->
                        substitute module("io.github.mcagentsmods:mcagents-core-client-${version.name}") using project(":platforms:client-${version.name}")
                    }
        }
    }
}

// MCAgents agents — the tool registry and the tool-calling agent chat answers through. The
// same arrangement as core: a checkout of MCAgents-Mods/agents beside this one (or wherever
// -Pagents-build points) is built with chat, and without one the published
// mcagents-agents-{tool,api,common} are read from agents' GitHub Packages repository.
def agentsBuild = file(providers.gradleProperty('agents-build').getOrElse('../agents'))
if (new File(agentsBuild, 'settings.gradle').isFile()) {
    includeBuild(agentsBuild) {
        dependencySubstitution {
            ['tool', 'api', 'common'].each { name ->
                substitute module("io.github.mcagentsmods:mcagents-agents-${name}") using project(":mcagents-agents-${name}")
            }
        }
    }
}

include 'mcagents-chat-api'
project(':mcagents-chat-api').projectDir = file('api')

include 'mcagents-chat-common'
project(':mcagents-chat-common').projectDir = file('common')

['shared', 'fabric', 'neoforge', 'forge'].each { module ->
    minecraftVersions.each { minecraft ->
        include "mcagents-chat-${module}-${minecraft}"
        project(":mcagents-chat-${module}-${minecraft}").projectDir = file("platforms/${module}/${minecraft}")
    }
}
