pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads a matching JDK when the toolchain the build asks for is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'chat'

// MCAgents core — the model client and the holograms chat runs on. With a checkout of
// MCAgents-Mods/core beside this one (or wherever -Pcore-build points), Gradle builds chat
// against that source, so a change to core is tested here before it is published. Without
// one, the published mcagents-core-api, mcagents-core-common and mcagents-core-client are
// resolved from core's GitHub Packages repository instead, which build.gradle declares.
def coreBuild = file(providers.gradleProperty('core-build').getOrElse('../core'))
if (new File(coreBuild, 'settings.gradle').isFile()) {
    includeBuild(coreBuild) {
        dependencySubstitution {
            substitute module('io.github.mcagentsmods:mcagents-core-api') using project(':api')
            substitute module('io.github.mcagentsmods:mcagents-core-common') using project(':common')
            substitute module('io.github.mcagentsmods:mcagents-core-client') using project(':platforms:client')
        }
    }
}

// MCAgents agents — the tool registry and the tool-calling agent chat answers through. The
// same arrangement as core: a checkout of MCAgents-Mods/agents beside this one (or wherever
// -Pagents-build points) is built with chat, and without one the published
// mcagents-agents-{tool,api,common} are read from agents' GitHub Packages repository.
def agentsBuild = file(providers.gradleProperty('agents-build').getOrElse('../agents'))
if (new File(agentsBuild, 'settings.gradle').isFile()) {
    includeBuild(agentsBuild) {
        dependencySubstitution {
            ['tool', 'api', 'common'].each { name ->
                substitute module("io.github.mcagentsmods:mcagents-agents-${name}") using project(":mcagents-agents-${name}")
            }
        }
    }
}

include 'mcagents-chat-api'
project(':mcagents-chat-api').projectDir = file('api')

include 'mcagents-chat-common'
project(':mcagents-chat-common').projectDir = file('common')

include 'mcagents-chat-shared'
project(':mcagents-chat-shared').projectDir = file('platforms/shared')

include 'mcagents-chat-fabric'
project(':mcagents-chat-fabric').projectDir = file('platforms/fabric')

include 'mcagents-chat-neoforge'
project(':mcagents-chat-neoforge').projectDir = file('platforms/neoforge')
