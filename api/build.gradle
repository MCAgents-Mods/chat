// Contracts only: interfaces, records, enums, abstract classes.
//
// This module compiles against the JDK and MCAgents core's API, and nothing else. It must
// never gain a dependency on Minecraft, on Fabric, or on any third-party library — see
// .agents/rules/repository.md.

plugins {
    id 'java-library'
}

base {
    archivesName = 'MCAgentsChatApi'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
}

repositories {
    mavenCentral()
}

dependencies {
    // Chat's contracts speak core's types — a model request, a tool call, a model name.
    // compileOnlyApi: every module above sees them, and no jar of chat's carries them,
    // because the mcagents_core mod provides one copy for every MCAgents mod in game.
    compileOnlyApi libs.core.api
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'MCAgentsChatApi'
                url = 'https://github.com/MCAgents-Mods/chat'
            }
        }
    }
}
