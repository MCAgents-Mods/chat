<!DOCTYPE html>
<!--
  The knowledge list. Served at /chat/knowledge/ by ChatWebModule, through core's console.

  Everything below is static: the page fetches what it shows, so this file never contains
  player data and there is nothing here to escape. Assets are same-origin and nothing is
  fetched from off the machine — see .agents/design/web-design-system.md.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Knowledge · MCAgents Console</title>
  <link rel="stylesheet" href="/assets/core/css/main.css">
  <link rel="stylesheet" href="/assets/core/css/layout.css">
  <link rel="stylesheet" href="/assets/core/css/components.css">
  <link rel="stylesheet" href="/assets/chat/css/knowledge/knowledge.css">
</head>
<body data-module="chat" data-section="knowledge">
<div id="site-header"></div>

<main>
  <div class="container">
    <section class="hero">
      <p class="eyebrow">Local library</p>
      <h1>Knowledge Packs</h1>
      <p class="lead">Every pack stored on this machine. Twenty load at a time — keep
        scrolling for more.</p>
    </section>

    <div class="toolbar">
      <div class="search">
        <label class="visually-hidden" for="knowledge-search">Search packs</label>
        <input class="field" id="knowledge-search" type="search" autocomplete="off"
               placeholder="Search titles and text…">
      </div>
      <button class="btn btn--small" type="button" id="refresh-knowledge">Refresh</button>
      <span class="count" id="knowledge-count"></span>
      <span class="sync-note" id="sync-note"></span>
    </div>

    <div class="chip-row" id="knowledge-filters" role="group" aria-label="Filter by category">
      <button class="chip" type="button" data-availability="free">Free</button>
      <button class="chip" type="button" data-availability="premium">Premium</button>
    </div>

    <div class="pack-scroller pack-scroller--library" id="pack-scroller" tabindex="0"
         role="region" aria-label="Knowledge Packs">
      <div class="card-grid" id="knowledge-list"></div>
      <div id="scroll-sentinel" aria-hidden="true"></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="/assets/core/js/site.js"></script>
<script src="/assets/chat/js/knowledge.js"></script>
</body>
</html>
