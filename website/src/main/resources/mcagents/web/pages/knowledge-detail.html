<!DOCTYPE html>
<!--
  One Knowledge Pack, read-only. Served at /chat/knowledge/<id>.

  The id is not substituted into this file: the page reads it out of the address bar and
  asks the API for it, so the markup stays static and carries no player data.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pack · MCAgents Console</title>
  <link rel="stylesheet" href="/assets/core/css/main.css">
  <link rel="stylesheet" href="/assets/core/css/layout.css">
  <link rel="stylesheet" href="/assets/core/css/components.css">
  <link rel="stylesheet" href="/assets/chat/css/knowledge/knowledge.css">
</head>
<body data-module="chat" data-section="knowledge">
<div id="site-header"></div>

<main>
  <div class="container narrow">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a id="breadcrumb-list" href="#">Knowledge</a>
      <span class="sep" aria-hidden="true">/</span>
      <span id="breadcrumb-current">Pack</span>
    </nav>

    <div id="pack-state" class="state">Loading…</div>

    <div id="pack-body" hidden>
      <section class="hero">
        <p class="eyebrow">Knowledge Pack</p>
        <h1 id="pack-title">Pack</h1>
        <div class="chip-row" id="pack-badges" style="margin-top:.6rem"></div>
      </section>

      <div class="callout callout--info readonly-note">
        <span class="callout__icon" aria-hidden="true">&#128274;</span>
        <span>This page is a showcase. Packs are replaced whole, so nothing here can be edited
          from the console.</span>
      </div>

      <section class="panel" id="stored-actions">
        <h2>This copy</h2>
        <p class="muted field-note">Acts on your machine only.</p>
        <div class="btn-row">
          <button class="btn btn--danger" type="button" id="delete-pack">Delete</button>
          <span class="sync-note" id="stored-note"></span>
        </div>
      </section>

      <section class="panel">
        <h2>Details</h2>
        <div class="deflist" id="pack-facts"></div>
      </section>

      <section class="panel">
        <h2>Content</h2>
        <p class="pack-body" id="pack-detail"></p>
      </section>

      <section class="panel" id="embedding-panel">
        <h2>Embedding</h2>
        <p class="muted" id="embedding-size" style="font-size:.82rem"></p>
        <pre class="embedding"><code id="pack-embedding"></code></pre>
      </section>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="/assets/core/js/site.js"></script>
<script src="/assets/chat/js/knowledge-detail.js"></script>
</body>
</html>
