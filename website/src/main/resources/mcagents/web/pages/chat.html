<!DOCTYPE html>
<!--
  The chat page. Served at /chat/chat/.

  Writes as well as reads: a question asked here goes to the same store and the same agent
  the in-game screen uses. The page polls a revision counter so a message typed in Minecraft
  appears without a refresh.

  It also chooses who answers. The provider selector beside the composer writes the same
  model preference the model page and the game screen read, so the choice is one choice
  wherever it is made.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Chat · MCAgents Console</title>
  <link rel="stylesheet" href="/assets/core/css/main.css">
  <link rel="stylesheet" href="/assets/core/css/layout.css">
  <link rel="stylesheet" href="/assets/core/css/components.css">
  <link rel="stylesheet" href="/assets/chat/css/chat/chat.css">
</head>
<body data-module="chat" data-section="chat">
<div id="site-header"></div>

<main>
  <div class="container">
    <div class="chat-layout">
      <aside class="panel chat-side" aria-label="Conversations">
        <div class="btn-row">
          <button class="btn btn--primary btn--small" type="button" id="new-chat">New chat</button>
          <span class="count" id="chat-count"></span>
        </div>

        <label class="visually-hidden" for="chat-search">Search chats</label>
        <input class="field" id="chat-search" type="search" autocomplete="off"
               placeholder="Search chats…" style="margin-top:.6rem">

        <div class="chat-side__list" id="chat-list">
          <div id="scroll-sentinel" aria-hidden="true"></div>
        </div>
      </aside>

      <section class="panel chat-main" aria-label="Conversation">
        <header class="chat-main__head">
          <span class="chat-main__title" id="chat-title">No chat selected</span>
          <span class="sync-note" id="knowledge-notice"></span>
          <span class="sync-note" id="sync-note"></span>
          <button class="btn btn--small" type="button" id="embed-knowledge"
                  title="Give stored packs a vector, so the agent can find them">Check embeddings</button>
          <button class="btn btn--small" type="button" id="edit-persona"
                  title="Edit AGENTS.md — the instructions every answer starts from">AGENTS.md</button>
          <button class="btn btn--small" type="button" id="rename-chat" disabled>Rename</button>
          <button class="btn btn--small btn--danger" type="button" id="delete-chat" disabled>Delete</button>
        </header>

        <div class="messages" id="messages">
          <div class="state">Pick a chat on the left, or start a new one.</div>
        </div>

        <!-- Who answers, chosen next to the box the question is typed into rather than on
             the model page: it is a decision about the question in front of you, and it is
             the same stored choice the game reads, in force from the next question on. -->
        <div class="composer-meta">
          <label class="composer-meta__label" for="chat-provider">Answered by</label>
          <select class="field chat-provider" id="chat-provider"></select>
          <label class="visually-hidden" for="chat-provider-other">Name the provider</label>
          <input class="field chat-provider" id="chat-provider-other" hidden
                 autocomplete="off" spellcheck="false" placeholder="Name it…">
          <span class="badge" id="chat-route" hidden></span>
          <span class="muted composer-meta__note" id="chat-provider-note"></span>
        </div>

        <div class="composer">
          <label class="visually-hidden" for="prompt">Ask the agent</label>
          <textarea class="field" id="prompt" rows="2" placeholder="Ask the agent…" disabled></textarea>
          <button class="btn btn--primary" type="button" id="send" disabled>Send</button>
        </div>
      </section>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="/assets/core/js/site.js"></script>
<script src="/assets/chat/js/chat.js"></script>
</body>
</html>
