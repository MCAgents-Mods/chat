# Platform coordinates for MCAgentsClient.
#
# gradle.properties carries the project's identity only (organization, repository,
# version). Everything that pins a dependency lives here.
#
# Check https://meta.fabricmc.net/v2/versions/ before changing a Minecraft, loader, or
# Fabric API version. Minecraft 26.x publishes no Yarn mappings and no intermediary —
# Fabric Loom resolves Mojang's official mappings on its own, so there is no mappings
# coordinate to declare. Keep these in step with MCAgents core's own catalog: a mod built for
# a different Minecraft than core's cannot load beside it.

[versions]
java = "25"
fabric-loader = "0.19.5"
fabric-loom = "1.18.4"
moddevgradle = "2.0.148"
forgegradle = "7.0.40"
# Forge's Jar-in-Jar plugin, which nests sqlite-jdbc in the Forge jar.
forge-jarjar = "0.2.3"
sqlite-jdbc = "3.53.2.1"
# Provided by Minecraft at runtime — declared so common/ can compile, never bundled.
gson = "2.14.0"
junit = "6.1.3"
# MCAgents core, tools and agent included. Compiled against, never bundled: the mcagents_core
# mod provides it in game.
mcagents-core = "0.12.0"
# The block for the one Minecraft version this mod supports, the latest release, each entry
# suffixed with the version (26.3 -> -26-3). Every Minecraft-facing module has a subproject
# for it, platforms/{module}/{version}, which finds its entries by that suffix; the version
# itself is listed in settings.gradle. Moving to a new release replaces this block, that
# entry and each module's version folder; the old version is not kept. Check
# https://maven.neoforged.net/releases/net/neoforged/neoforge/ and
# https://maven.minecraftforge.net/net/minecraftforge/forge/ for a NeoForge and a Forge build of
# the same Minecraft version before changing any of them. Forge's pack.mcmeta in
# platforms/forge/{version} moves with it: copy its formats from that Forge build's own.
minecraft-26-3 = "26.3"
fabric-api-26-3 = "0.162.0+26.3"
neoforge-26-3 = "26.3.0.76"
forge-26-3 = "26.3-66.0.11"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
minecraft-26-3 = { module = "com.mojang:minecraft", version.ref = "minecraft-26-3" }
fabric-api-26-3 = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api-26-3" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
core-api = { module = "io.github.mcagentsmods:core-api", version.ref = "mcagents-core" }
core-common = { module = "io.github.mcagentsmods:core-common", version.ref = "mcagents-core" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle" }
forge-jarjar = { id = "net.minecraftforge.jarjar", version.ref = "forge-jarjar" }
