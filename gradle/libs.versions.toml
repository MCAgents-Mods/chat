# Platform coordinates for MCAgentsClient.
#
# gradle.properties carries the project's identity only (organization, repository,
# version). Everything that pins a dependency lives here.
#
# Check https://meta.fabricmc.net/v2/versions/ before changing a Minecraft, loader, or
# Fabric API version. Minecraft 26.x publishes no Yarn mappings and no intermediary —
# Fabric Loom resolves Mojang's official mappings on its own, so there is no mappings
# coordinate to declare.

[versions]
java = "25"
minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-api = "0.157.0+26.2"
fabric-loom = "1.17.19"
# Check https://maven.neoforged.net/releases/net/neoforged/neoforge/ for a build of the same
# Minecraft version before changing either.
neoforge = "26.2.0.90"
moddevgradle = "2.0.148"
sqlite-jdbc = "3.53.2.1"
# Provided by Minecraft at runtime — declared so common/ can compile, never bundled.
gson = "2.14.0"
junit = "6.1.3"
# MCAgents core. Compiled against, never bundled: the mcagents_core mod provides it in game.
mcagents-core = "0.5.0"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
core-api = { module = "io.github.mcagentsmods:mcagents-core-api", version.ref = "mcagents-core" }
core-common = { module = "io.github.mcagentsmods:mcagents-core-common", version.ref = "mcagents-core" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
