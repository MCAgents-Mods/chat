# Platform coordinates for MCAgentsClient.
#
# gradle.properties carries the project's identity only (organization, repository,
# version). Everything that pins a dependency lives here.
#
# Check https://meta.fabricmc.net/v2/versions/ before changing a Minecraft, loader, or
# Fabric API version. Minecraft 26.x publishes no Yarn mappings and no intermediary —
# Fabric Loom resolves Mojang's official mappings on its own, so there is no mappings
# coordinate to declare. Keep these in step with MCAgents core's own catalog: a mod built for
# a different Minecraft than core's cannot load beside it.

[versions]
java = "25"
fabric-loader = "0.19.5"
fabric-loom = "1.18.4"
moddevgradle = "2.0.148"
sqlite-jdbc = "3.53.2.1"
# Provided by Minecraft at runtime — declared so common/ can compile, never bundled.
gson = "2.14.0"
junit = "6.1.3"
# MCAgents core. Compiled against, never bundled: the mcagents_core mod provides it in game.
mcagents-core = "0.7.0"
# MCAgents agents. Compiled against, never bundled: the mcagents_agents mod provides it in game.
mcagents-agents = "0.3.0"
# One block per Minecraft version, each entry suffixed with the version (26.2 -> -26-2).
# Every Minecraft-facing module has one subproject per version, platforms/{module}/{version},
# which finds its entries by that suffix; the version list itself is in settings.gradle. Check
# https://maven.neoforged.net/releases/net/neoforged/neoforge/ for a NeoForge build of the
# same Minecraft version before changing either.
minecraft-26-2 = "26.2"
fabric-api-26-2 = "0.157.0+26.2"
neoforge-26-2 = "26.2.0.90"
minecraft-26-3 = "26.3"
fabric-api-26-3 = "0.162.0+26.3"
neoforge-26-3 = "26.3.0.76"

[libraries]
minecraft-26-2 = { module = "com.mojang:minecraft", version.ref = "minecraft-26-2" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api-26-2 = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api-26-2" }
minecraft-26-3 = { module = "com.mojang:minecraft", version.ref = "minecraft-26-3" }
fabric-api-26-3 = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api-26-3" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
core-api = { module = "io.github.mcagentsmods:mcagents-core-api", version.ref = "mcagents-core" }
core-common = { module = "io.github.mcagentsmods:mcagents-core-common", version.ref = "mcagents-core" }
agents-common = { module = "io.github.mcagentsmods:mcagents-agents-common", version.ref = "mcagents-agents" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
