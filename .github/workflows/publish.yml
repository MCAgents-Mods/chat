name: Publish

# Publishes chat's library modules, api, common and shared (mcagents-chat-{module}),
# to GitHub Packages and tags the commit when a release lands on master. The
# fabric, neoforge and forge mod jars are not published here; the Release
# workflow attaches them to the version's GitHub release.
#
# The version is project-version in gradle.properties. The first step looks for
# the v{version} tag on the remote: when it exists the run stops there, so an
# ordinary merge that leaves the version alone publishes nothing. When it does
# not exist the run tests, publishes, and only then creates the tag, so a
# failed publish never leaves a tag behind and the next run tries again.
#
# Chat compiles against MCAgents core and MCAgents agents, which the build reads
# from each one's own GitHub Packages repository, so the build step carries the
# same token as the publish step. The core and agents versions chat names must
# be published before chat is.
#
# workflow_dispatch runs the same check by hand, to retry a release after a
# failure.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the version and look for its tag
        id: release
        run: |
          version=$(sed -n 's/^project-version=//p' gradle.properties | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::project-version '$version' in gradle.properties is not Major.Minor.Patch"
            exit 1
          fi
          tag="v$version"
          found=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$found" ]; then
            echo "::notice::$tag already exists, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        if: steps.release.outputs.publish == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build

      - name: Publish to GitHub Packages
        if: steps.release.outputs.publish == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish

      - name: Tag the release
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
