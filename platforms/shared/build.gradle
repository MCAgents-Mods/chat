// The client code every loader shares: start-up, the screens, the menu buttons and the
// factories that wire common/ together.
//
// Compiled against vanilla Minecraft and nothing else — no Fabric, NeoForge or Forge type may
// appear here. Minecraft 26.x ships unobfuscated, so the same classes link against any
// loader's game. platforms/fabric, platforms/neoforge and platforms/forge each bundle this
// module into their jar and add only their entry point, key registration and events.
//
// Built for the one Minecraft version chat supports, libs.versions.minecraft in the catalog,
// with Loom used for the vanilla game alone (no loader, no mod metadata, no run configs).

plugins {
    id 'net.fabricmc.fabric-loom'
}

def minecraftVersion = libs.versions.minecraft.get()

base {
    archivesName = 'MCAgentsChatShared'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
    // Loom's game jar carries Fabric's @Environment annotation, whose enum is deliberately
    // not on this module's classpath, and javac warns once per class that reads it with no
    // lint switch to turn that off. Errors still fail the build.
    options.warnings = false
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft libs.minecraft

    api project(':chat-api')
    api project(':chat-common')

    // Core's holograms, for the chat hologram CHAT opens. The mcagents_core mod supplies them
    // in game.
    compileOnly libs.core.client
}

tasks.named('jar', Jar) {
    // MCAgentsChatShared-0.13.2+26.3.jar: the mod's version, then the game's.
    archiveVersion = "${project.version}+${minecraftVersion}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'MCAgentsChatShared'
                description = "MCAgents chat's shared game code, Minecraft ${minecraftVersion}"
                url = 'https://github.com/MCAgents-Mods/chat'
            }
        }
    }
}
