// The client code both loaders share: start-up, the screens, the key and the factories that
// wire common/ and website/ together.
//
// Compiled against vanilla Minecraft and nothing else — no Fabric, no NeoForge type may
// appear here. Minecraft 26.x ships unobfuscated, so the same classes link against either
// loader's game. platforms/fabric and platforms/neoforge each bundle this module into their
// jar and add only their entry point, key registration and events.

plugins {
    // Loom is used for the vanilla game alone: no loader, no mod metadata, no run configs.
    alias(libs.plugins.fabric.loom)
}

base {
    archivesName = 'MCAgentsChatShared'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
    // Loom's game jar carries Fabric's @Environment annotation, whose enum is deliberately
    // not on this module's classpath, and javac warns once per class that reads it with no
    // lint switch to turn that off. Errors still fail the build.
    options.warnings = false
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft libs.minecraft

    api project(':mcagents-chat-api')
    api project(':mcagents-chat-common')
    api project(':mcagents-chat-website')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'MCAgentsChatShared'
                url = 'https://github.com/MCAgents-Mods/chat'
            }
        }
    }
}
