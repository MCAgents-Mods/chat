// The Fabric mod jar: the client entry point, which registers the key and the connection
// events and finds the game directory, plus everything platforms/shared and the modules
// below it carry.
//
// This is the only module that may reference Fabric types. The screens and start-up live in
// platforms/shared, the logic in common/ — see .agents/rules/repository.md.

plugins {
    alias(libs.plugins.fabric.loom)
}

base {
    archivesName = 'MCAgentsChatFabric'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
}

repositories {
    mavenCentral()
}

loom {
    mods {
        'mcagents' {
            sourceSet sourceSets.main
            // The dev client loads platforms/shared as part of this mod, as the jar merges it,
            // so it finds the screens' strings there. Only a Loom module can be named here;
            // api/ and common/ carry no game assets.
            sourceSet 'main', ':mcagents-chat-shared'
        }
    }
}

dependencies {
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api

    implementation project(':mcagents-chat-api')
    implementation project(':mcagents-chat-common')
    implementation project(':mcagents-chat-shared')

    // sqlite-jdbc is a plain library, not a mod, so Loom wraps it before nesting it.
    // Bundling it is what lets the mod store data on a machine that has never been online.
    include libs.sqlite.jdbc
}

// api/, common/ and platforms/shared are chat's own code, so their classes and
// resources are merged into the mod jar rather than nested as separate Fabric mods.
// Third-party runtime libraries are bundled with Loom's `include` instead.
def bundledModules = [
        ':mcagents-chat-api',
        ':mcagents-chat-common',
        ':mcagents-chat-shared'
]

tasks.named('jar', Jar) {
    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }
}

processResources {
    def modVersion = project.version
    // The core and agents this build compiled against are the oldest the jar may run with.
    def coreVersion = libs.versions.mcagents.core.get()
    def agentsVersion = libs.versions.mcagents.agents.get()
    inputs.property 'version', modVersion
    inputs.property 'coreVersion', coreVersion
    inputs.property 'agentsVersion', agentsVersion

    filesMatching('fabric.mod.json') {
        expand version: modVersion, coreVersion: coreVersion, agentsVersion: agentsVersion
    }
}

// The license travels with the jar, renamed so it cannot be mistaken for a dependency's.
tasks.named('jar', Jar) {
    def projectName = project.name
    inputs.property 'projectName', projectName

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${projectName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // The mod jar alone, with no dependency list: it already carries api, common
            // and shared, nests SQLite, and the loader, mcagents_core and
            // mcagents_agents supply the rest.
            artifact tasks.named('jar')

            pom {
                name = 'MCAgentsChatFabric'
                url = 'https://github.com/MCAgents-Mods/chat'
            }
        }
    }
}
