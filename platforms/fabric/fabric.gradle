// The Fabric mod jar: the client entry point, which registers the key and the connection
// events and finds the game directory, plus everything platforms/shared and the modules
// below it carry.
//
// This is the only module that may reference Fabric types. The screens and start-up live in
// platforms/shared, the logic in common/ — see .agents/rules/repository.md.

// Built for the Minecraft version chat supports: platforms/fabric/{version}/build.gradle
// applies Loom, then this.

apply from: '../../minecraft.gradle'

base {
    archivesName = 'MCAgentsChatFabric'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
}

repositories {
    mavenCentral()
}

loom {
    mods {
        'mcagents' {
            sourceSet sourceSets.main
            // The dev client loads platforms/shared as part of this mod, as the jar merges it,
            // so it finds the screens' strings there. Only a Loom module can be named here;
            // api/ and common/ carry no game assets.
            sourceSet 'main', sharedModule
        }
    }
}

dependencies {
    minecraft libraryFor('minecraft')

    // Chat's own modules are part of this mod: the jar task below merges their classes, and
    // the dev client runs them from this module's class path. This module is never published,
    // so implementation reaches nothing else. Core is not declared here: no class in this
    // module uses it, and api/, common/ and platforms/shared compile against it with
    // compileOnly, since the mcagents_core mod provides it in game.
    implementation project(':chat-api')
    implementation project(':chat-common')
    implementation project(sharedModule)

    // Only compiled against: the game provides Fabric Loader and Fabric API at runtime.
    compileOnly libs.fabric.loader
    compileOnly libraryFor('fabric-api')

    // The dev client (runClient) is the one place no game provides them, so it gets them here.
    runtimeOnly libs.fabric.loader
    runtimeOnly libraryFor('fabric-api')

    // sqlite-jdbc is a plain library, not a mod, so Loom wraps it before nesting it.
    // Bundling it is what lets the mod store data on a machine that has never been online.
    // common/ only compiles against it, so the dev client gets it here.
    include libs.sqlite.jdbc
    runtimeOnly libs.sqlite.jdbc
}

// api/, common/ and platforms/shared are chat's own code, so their classes and
// resources are merged into the mod jar rather than nested as separate Fabric mods.
// Third-party runtime libraries are bundled with Loom's `include` instead.
def bundledModules = [
        ':chat-api',
        ':chat-common',
        sharedModule
]

tasks.named('jar', Jar) {
    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }
}

processResources {
    def modVersion = project.version
    // The core this build compiled against is the oldest the jar may run with.
    def coreVersion = libs.versions.mcagents.core.get()
    def minecraft = minecraftVersion
    def fabricLoader = libs.versions.fabric.loader.get()
    inputs.property 'version', modVersion
    inputs.property 'coreVersion', coreVersion
    inputs.property 'minecraft', minecraft
    inputs.property 'fabricLoader', fabricLoader

    filesMatching('fabric.mod.json') {
        expand version: modVersion, coreVersion: coreVersion,
                minecraft: minecraft, fabricLoader: fabricLoader
    }
}

// The license travels with the jar, renamed so it cannot be mistaken for a dependency's.
tasks.named('jar', Jar) {
    def projectName = project.name
    inputs.property 'projectName', projectName

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${projectName}" }
    }
}

// The mod jar is never published to GitHub Packages: the Release workflow attaches it to the
// GitHub release of each version, and only the library modules are published.
