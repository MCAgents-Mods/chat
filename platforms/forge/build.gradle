// The Forge mod jar: the client entry point, which adds chat's menu buttons, registers the
// connection events and finds the game directory, plus everything platforms/shared and the
// modules below it carry.
//
// This is the only module that may reference Forge types. The screens and start-up live in
// platforms/shared, the logic in common/ — see .agents/rules/repository.md.

// Built for the one Minecraft version chat supports, libs.versions.minecraft in the catalog.
// src/main/resources holds the pack.mcmeta for that version; Forge, unlike NeoForge and
// Fabric, does not make one for a mod.

plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
}

def minecraftVersion = libs.versions.minecraft.get()

// The first Minecraft version this one does not cover, for the closed range the mod metadata
// declares: 26.3 -> 26.4.
def minecraftNext = minecraftVersion.tokenize('.').with { parts ->
    "${parts[0]}.${(parts[1] as int) + 1}"
}

base {
    archivesName = 'MCAgentsChatForge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    def forge = minecraft.dependency("net.minecraftforge:forge:${libs.versions.forge.get()}")

    // Chat's own modules are part of this mod: the jar task below merges their classes, and
    // the dev client runs them from this module's class path. This module is never published,
    // so implementation reaches nothing else. Core is not declared here: no class in this
    // module uses it, and api/, common/ and platforms/shared compile against it with
    // compileOnly, since the mcagents_core mod provides it in game.
    implementation project(':chat-api')
    implementation project(':chat-common')
    implementation project(':chat-shared')

    // Only compiled against: the game provides Forge at runtime.
    compileOnly forge

    // The dev client (runClient) is the one place no game provides it, so it gets it here.
    runtimeOnly forge

    // sqlite-jdbc is not bundled: its native libraries would make up nearly all of the jar.
    // common/ only compiles against it, and the dev client gets it here.
    runtimeOnly libs.sqlite.jdbc
}

// api/, common/ and platforms/shared are chat's own code, so their classes and resources are
// merged into the mod jar rather than nested.
def bundledModules = [
        ':chat-api',
        ':chat-common',
        ':chat-shared'
]

bundledModules.each { path -> evaluationDependsOn(path) }

// Forge's dev client takes the directory holding a mods.toml as the whole mod, so it gets one
// directory holding what the jar holds; the modules' own jars stay off its class path, and
// sqlite-jdbc stays on it as a library.
def devMod = tasks.register('devModDirectory', Sync) {
    into layout.buildDirectory.dir('devMod')
    from sourceSets.main.output
    bundledModules.each { path -> from project(path).sourceSets.main.output }
}

minecraft {
    runs {
        // A development client: ./gradlew :chat-forge:runClient, in run/.
        // Core's Forge jar for the same Minecraft version goes in run/mods/.
        client {
            workingDir = project.file('run')
        }
    }
}

// ForgeGradle fills in the run's class path itself, so the separate pieces are swapped for the
// one directory just before the game starts.
tasks.withType(JavaExec).matching { it.name == 'runClient' }.configureEach {
    dependsOn devMod
    def merged = files(devMod)
    def separate = files(sourceSets.main.output)
    // Captured here rather than called from the action, which the configuration cache would
    // refuse.
    def fileCollections = objects
    doFirst {
        def rest = classpath.files.findAll { file ->
            !separate.contains(file) && !file.name.startsWith('MCAgentsChat')
        }
        classpath = merged + fileCollections.fileCollection().from(rest)
    }
}

tasks.named('jar', Jar) {
    // MCAgentsChatForge-0.13.2+26.3.jar: the mod's version, then the game's.
    archiveVersion = "${project.version}+${minecraftVersion}"

    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }

    // The license travels with the jar, renamed so it cannot be mistaken for a dependency's.
    def projectName = project.name
    inputs.property 'projectName', projectName
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${projectName}" }
    }
}

processResources {
    def modVersion = project.version
    // The core this build compiled against is the oldest the jar may run with.
    def coreVersion = libs.versions.mcagents.core.get()
    def minecraft = minecraftVersion
    def next = minecraftNext
    // The loader's major version, which mods.toml ranges are in: 66 from 26.3-66.0.11.
    def forgeMajor = libs.versions.forge.get().tokenize('-')[1].tokenize('.')[0]
    inputs.property 'version', modVersion
    inputs.property 'coreVersion', coreVersion
    inputs.property 'minecraft', minecraft
    inputs.property 'minecraftNext', next
    inputs.property 'forgeMajor', forgeMajor

    filesMatching('META-INF/mods.toml') {
        expand version: modVersion, coreVersion: coreVersion,
                minecraft: minecraft, minecraftNext: next, forgeMajor: forgeMajor
    }
}

// The mod jar is never published to GitHub Packages: the Release workflow attaches it to the
// GitHub release of each version, and only the library modules are published.
