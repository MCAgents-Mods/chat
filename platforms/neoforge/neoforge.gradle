// The NeoForge mod jar: the client entry point, which registers the key and the client
// events and finds the game directory, plus everything platforms/shared and the modules
// below it carry.
//
// This is the only module that may reference NeoForge types. The screens and start-up live
// in platforms/shared, the logic in common/ — see .agents/rules/repository.md.

// Built for the Minecraft version chat supports: platforms/neoforge/{version}/build.gradle
// applies ModDevGradle, then this.

apply from: '../../minecraft.gradle'

base {
    archivesName = 'MCAgentsChatNeoforge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = libs.versions.java.get() as int
}

repositories {
    mavenCentral()
}

// api/, common/ and platforms/shared are chat's own code, so their classes and
// resources are merged into the mod jar rather than nested. Third-party runtime libraries
// are nested with jarJar instead.
def bundledModules = [
        ':chat-api',
        ':chat-common',
        sharedModule
]

// The dev client loads the modules above as one mod, as the jar does; loaded apart, NeoForge
// gives them a different class loader from the game and they cannot share its types.
bundledModules.each { path -> evaluationDependsOn(path) }

neoForge {
    version = versionFor('neoforge')

    // A development client: ./gradlew :chat-neoforge:runClient, in run/.
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
    }

    mods {
        'mcagents' {
            sourceSet sourceSets.main
            bundledModules.each { path -> sourceSet project(path).sourceSets.main }
        }
    }
}

dependencies {
    // Chat's own modules are part of this mod: the jar task below merges their classes, and
    // the dev client runs them from this module's class path. This module is never published,
    // so implementation reaches nothing else. Core is not declared here: no class in this
    // module uses it, and api/, common/ and platforms/shared compile against it with
    // compileOnly, since the mcagents_core mod provides it in game.
    implementation project(':chat-api')
    implementation project(':chat-common')
    implementation project(sharedModule)

    // NeoForge itself is not declared here: ModDevGradle compiles against it and runs the dev
    // client on it, and the game provides it at runtime.

    // sqlite-jdbc is a plain library, not a mod. NeoForge nests it as Jar-in-Jar and loads
    // it as a library, which is what lets the mod store data on a machine that has never
    // been online. common/ only compiles against it, so the dev client gets it here.
    jarJar libs.sqlite.jdbc
    runtimeOnly libs.sqlite.jdbc
}

tasks.named('jar', Jar) {
    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }

    // The license travels with the jar, renamed so it cannot be mistaken for a dependency's.
    def projectName = project.name
    inputs.property 'projectName', projectName
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${projectName}" }
    }
}

processResources {
    def modVersion = project.version
    // The core this build compiled against is the oldest the jar may run with.
    def coreVersion = libs.versions.mcagents.core.get()
    def minecraft = minecraftVersion
    def next = minecraftNext
    inputs.property 'version', modVersion
    inputs.property 'coreVersion', coreVersion
    inputs.property 'minecraft', minecraft
    inputs.property 'minecraftNext', next

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: modVersion, coreVersion: coreVersion,
                minecraft: minecraft, minecraftNext: next
    }
}

// The mod jar is never published to GitHub Packages: the Release workflow attaches it to the
// GitHub release of each version, and only the library modules are published.
