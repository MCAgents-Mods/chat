modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/MCAgents-Mods/chat/issues"

[[mods]]
modId = "mcagents"
version = "${version}"
displayName = "MCAgentsClient"
authors = "MCAgents"
displayURL = "https://github.com/MCAgents-Mods/chat"
description = '''
A client-side AI assistant for Minecraft. Chat with an LLM agent using your own OpenRouter key, with Knowledge Packs kept on your machine and retrieved by embedding similarity.
'''

[[dependencies.mcagents]]
modId = "neoforge"
type = "required"
versionRange = "[${minecraft},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mcagents]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft},${minecraftNext})"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mcagents]]
modId = "mcagents_core"
type = "required"
versionRange = "[${coreVersion},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.mcagents]]
modId = "mcagents_agents"
type = "required"
versionRange = "[${agentsVersion},)"
ordering = "AFTER"
side = "CLIENT"
