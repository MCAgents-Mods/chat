plugins {
    // Both loader toolchains are declared once, here, so they load into one shared build
    // classloader instead of one per module.
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.moddevgradle) apply false
}

allprojects {
    group = 'io.github.mcagentsmods'
    version = providers.gradleProperty('project-version').get()
}

subprojects {
    // MCAgents core is published to GitHub Packages, not Maven Central. A checkout of core
    // beside this one replaces these coordinates with core's source (see settings.gradle) and
    // this repository is never asked; without one, as on a CI runner, core's published jars
    // are read from here. GitHub Packages wants a token even for a public package: the
    // workflow's GITHUB_TOKEN, or locally a personal access token with read:packages.
    repositories {
        maven {
            name = 'MCAgentsCore'
            url = "https://maven.pkg.github.com/${providers.gradleProperty('git-org').get()}/core"
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
            content {
                includeGroup 'io.github.mcagentsmods'
            }
        }
    }

    // Every module publishes under its project name, which settings.gradle sets to
    // mcagents-chat-{module}: the group alone cannot tell chat's api from core's. The jar
    // each module builds is named by its own archivesName, MCAgentsChat{Module}.
    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = "https://maven.pkg.github.com/${providers.gradleProperty('git-org').get()}/${providers.gradleProperty('git-repo').get()}"
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
