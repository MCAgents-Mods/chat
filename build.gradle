plugins {
    // The loader toolchains are declared once, here, so they load into one shared build
    // classloader instead of one per module.
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.moddevgradle) apply false
    alias(libs.plugins.forgegradle) apply false
    alias(libs.plugins.forge.jarjar) apply false
}

allprojects {
    group = 'io.github.mcagentsmods'
    version = providers.gradleProperty('project-version').get()
}

subprojects {
    // MCAgents core and agents are published to GitHub Packages, not Maven Central. A
    // checkout of either beside this one replaces its coordinates with its source (see
    // settings.gradle) and its repository is never asked; without one, as on a CI runner, the
    // published jars are read from here. GitHub Packages wants a token even for a public
    // package: the workflow's GITHUB_TOKEN, or locally a personal access token with
    // read:packages. Each repository is asked only for its own modules.
    repositories {
        ['core', 'agents'].each { mod ->
            maven {
                name = "MCAgents${mod.capitalize()}"
                url = "https://maven.pkg.github.com/${providers.gradleProperty('git-org').get()}/${mod}"
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
                content {
                    includeModuleByRegex 'io\\.github\\.mcagentsmods', "mcagents-${mod}-.*"
                }
            }
        }
    }

    // Every module publishes under its project name, which settings.gradle sets to
    // mcagents-chat-{module}: the group alone cannot tell chat's api from core's. The jar
    // each module builds is named by its own archivesName, MCAgentsChat{Module}.
    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = "https://maven.pkg.github.com/${providers.gradleProperty('git-org').get()}/${providers.gradleProperty('git-repo').get()}"
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}
